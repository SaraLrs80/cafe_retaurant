<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rimberio — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap"
          rel="stylesheet"/>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style type="text/css">
        :root {
            --orange:        #F28C28;
            --orange-dark:   #D9711A;
            --orange-light:  #FFAB76;
            --orange-bg:     #FFF3EC;
            --green:         #2E7D32;
            --green-light:   #4CAF50;
            --green-bg:      #F1F8E9;
            --red:           #C62828;
            --red-bg:        #FFEBEE;
            --sidebar-bg:    #1A1208;
            --sidebar-hover: #2E1A0A;
            --sidebar-active:#3D2210;
            --sidebar-w:     250px;
            --topbar-h:      64px;
            --cream:         #FDFAF5;
            --white:         #FFFFFF;
            --border:        #E8E0D0;
            --muted:         #7A7060;
            --dark:          #1A1208;
            --text:          #2C2416;
            --shadow-sm:     0 2px 12px rgba(26,18,8,.08);
            --shadow-md:     0 4px 16px rgba(26,18,8,.10);
            --radius:        12px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* ══════════════════════════════
           SIDEBAR
        ══════════════════════════════ */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0;
            z-index: 100;
            transition: transform .3s;
        }

        .sidebar-logo {
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: flex; align-items: center; gap: 11px;
            text-decoration: none;
        }

        .logo-img {
            width: 38px; height: 38px; border-radius: 10px;
            object-fit: cover; box-shadow: 0 4px 12px rgba(242,140,40,0.3);
            flex-shrink: 0;
        }

        .logo-text-block { display: flex; flex-direction: column; line-height: 1.1; }

        .logo-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem; font-weight: 900; color: white; letter-spacing: 1px;
        }
        .logo-name span { color: var(--orange); }

        .logo-role {
            font-size: 0.62rem; color: var(--orange-light);
            font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase;
            margin-top: 2px;
        }

        /* Navigation */
        .nav-section {
            padding: 20px 12px 8px;
            flex: 1;
            overflow-y: auto;
        }

        .nav-label {
            font-size: .62rem; font-weight: 600;
            color: rgba(255,255,255,.3);
            text-transform: uppercase; letter-spacing: .1em;
            padding: 0 8px; margin-bottom: 6px; margin-top: 16px;
        }
        .nav-label:first-child { margin-top: 0; }

        .nav-item {
            display: flex; align-items: center; gap: 11px;
            padding: 10px 12px;
            border-radius: 10px;
            color: rgba(255,255,255,.55);
            text-decoration: none;
            font-size: .88rem; font-weight: 500;
            transition: all .18s;
            margin-bottom: 2px;
        }

        .nav-item:hover {
            background: var(--sidebar-hover);
            color: rgba(255,255,255,.9);
        }

        .nav-item.active {
            background: var(--sidebar-active);
            color: var(--orange-light);
            font-weight: 600;
        }

        .nav-item.active .nav-icon { color: var(--orange-light); }

        .nav-icon {
            width: 17px; height: 17px;
            flex-shrink: 0;
            opacity: .65;
            transition: opacity .18s;
            stroke-width: 2;
        }
        .nav-item.active .nav-icon,
        .nav-item:hover .nav-icon { opacity: 1; stroke: currentColor; }

        /* Bas sidebar */
        .sidebar-footer {
            padding: 16px 12px;
            border-top: 1px solid rgba(255,255,255,.08);
        }

        .user-card {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            background: rgba(255,255,255,.05);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, var(--orange), var(--orange-light));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: .8rem; font-weight: 700; color: white;
            flex-shrink: 0;
        }

        .user-info { flex: 1; min-width: 0; }
        .user-name {
            font-size: .82rem; font-weight: 500;
            color: rgba(255,255,255,.9);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-email {
            font-size: .68rem; color: rgba(255,255,255,.4);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .btn-logout {
            display: flex; align-items: center; gap: 8px;
            width: 100%; padding: 9px 12px;
            background: transparent;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 8px;
            color: rgba(255,255,255,.5);
            font-family: 'Inter', sans-serif;
            font-size: .82rem; cursor: pointer;
            transition: all .2s;
            text-decoration: none;
        }
        .btn-logout:hover {
            background: rgba(192,57,43,.15);
            border-color: rgba(192,57,43,.3);
            color: #E57373;
        }

        /* ══════════════════════════════
           MAIN CONTENT
        ══════════════════════════════ */
        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            height: var(--topbar-h);
            background: var(--white);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            padding: 0 32px;
            position: sticky; top: 0; z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        .topbar-title {
            font-size: 1.05rem; font-weight: 600;
            color: var(--dark); flex: 1;
        }

        .topbar-right {
            display: flex; align-items: center; gap: 12px;
        }

        .topbar-badge {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            background: var(--orange-bg);
            border-radius: 20px;
            font-size: .75rem; font-weight: 500;
            color: var(--orange);
        }

        .badge-dot {
            width: 6px; height: 6px;
            background: var(--green-light);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }

        /* Page content */
        .page-content {
            padding: 28px 32px;
            flex: 1;
        }

        /* ══════════════════════════════
           COMPOSANTS PARTAGÉS
        ══════════════════════════════ */

        /* Stat cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex; align-items: center; gap: 16px;
            transition: transform .2s, box-shadow .2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 22px;
        }
        .stat-icon.orange { background: var(--orange-bg); }
        .stat-icon.green  { background: var(--green-bg); }
        .stat-icon.blue   { background: #EFF6FF; }
        .stat-icon.purple { background: #F5F3FF; }

        .stat-info { flex: 1; }
        .stat-value {
            font-size: 1.75rem; font-weight: 700;
            color: var(--dark); line-height: 1;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: .78rem; color: var(--muted);
            font-weight: 400;
        }

        /* Section header */
        .section-header {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 1rem; font-weight: 600;
            color: var(--dark);
        }

        /* Card */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .card-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            justify-content: space-between;
        }
        .card-head-title {
            font-size: .9rem; font-weight: 600; color: var(--dark);
        }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th {
            padding: 11px 16px;
            text-align: left;
            font-size: .72rem; font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .05em;
            background: #FAFAF8;
            border-bottom: 1px solid var(--border);
        }
        .data-table td {
            padding: 12px 16px;
            font-size: .85rem;
            border-bottom: 1px solid #F5F0E8;
            vertical-align: middle;
        }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tbody tr:hover { background: #FDFAF5; }

        /* Badges statut */
        .badge {
            display: inline-flex; align-items: center;
            padding: 3px 10px; border-radius: 20px;
            font-size: .72rem; font-weight: 600;
            letter-spacing: .02em;
        }
        .badge-success { background: var(--green-bg);  color: var(--green); }
        .badge-warning { background: #FFF8E1;           color: #F57F17; }
        .badge-danger  { background: #FFEBEE;           color: #C62828; }
        .badge-info    { background: #EFF6FF;           color: #1565C0; }
        .badge-muted   { background: #F5F5F5;           color: #616161; }

        /* Boutons */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 18px; border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: .85rem; font-weight: 600;
            cursor: pointer; border: none;
            transition: all .2s; text-decoration: none;
            justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--orange), var(--orange-dark)); color: white;
            box-shadow: 0 4px 14px rgba(242,140,40,.28);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(242,140,40,.38);
            color: white;
        }
        .btn-secondary {
            background: var(--cream); color: var(--dark);
            border: 1.5px solid var(--border);
        }
        .btn-secondary:hover { background: #f0ebe0; border-color: #c8bfa8; color: var(--dark); }
        .btn-danger { background: var(--red-bg); color: var(--red); border: 1.5px solid #FFCDD2; }
        .btn-danger:hover { background: #FFCDD2; }
        .btn-success { background: var(--green-bg); color: var(--green); }
        .btn-success:hover { background: #C8E6C9; }
        .btn-sm { padding: 6px 12px; font-size: .78rem; border-radius: 8px; }

        /* Grid 2 cols */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
    <ui:insert name="extraStyles"/>
</h:head>
<h:body>

    <div class="sidebar">
        <!-- Logo -->
        <h:link outcome="/pages/admin/dashboard" styleClass="sidebar-logo">
            <h:graphicImage library="images" name="Logo.jpeg" styleClass="logo-img" alt="RIMBERIO" />
            <div class="logo-text-block">
                <span class="logo-name">RIM<span>BERIO</span></span>
                <span class="logo-role">Espace Administrateur</span>
            </div>
        </h:link>

        <!-- Navigation -->
        <nav class="nav-section">
            <div class="nav-label">Principal</div>

            <h:link outcome="/pages/admin/dashboard"
                    styleClass="nav-item #{request.servletPath.contains('dashboard') ? 'active' : ''}">
                <i data-lucide="layout-dashboard" class="nav-icon"></i> Tableau de bord
            </h:link>

            <div class="nav-label">Gestion</div>

            <h:link outcome="/pages/admin/reservations"
                    styleClass="nav-item #{request.servletPath.contains('reservations') ? 'active' : ''}">
                <i data-lucide="calendar-check" class="nav-icon"></i> Réservations
            </h:link>

            <h:link outcome="/pages/admin/tables"
                    styleClass="nav-item #{request.servletPath.contains('tables') ? 'active' : ''}">
                <i data-lucide="armchair" class="nav-icon"></i> Tables
            </h:link>

            <h:link outcome="/pages/admin/commandes"
                    styleClass="nav-item #{request.servletPath.contains('commandes') ? 'active' : ''}">
                <i data-lucide="shopping-bag" class="nav-icon"></i> Commandes
            </h:link>

            <h:link outcome="/pages/admin/menu"
                    styleClass="nav-item #{request.servletPath.contains('menu') ? 'active' : ''}">
                <i data-lucide="book-open" class="nav-icon"></i> Menu
            </h:link>

            <div class="nav-label">Système</div>

            <h:link outcome="/pages/admin/utilisateurs"
                    styleClass="nav-item #{request.servletPath.contains('utilisateurs') ? 'active' : ''}">
                <i data-lucide="users" class="nav-icon"></i> Utilisateurs
            </h:link>

        </nav>

        <!-- Footer sidebar -->
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="avatar">
                    <h:outputText value="#{authBean.currentUser.prenom.substring(0,1)}#{authBean.currentUser.nom.substring(0,1)}"/>
                </div>
                <div class="user-info">
                    <div class="user-name">
                        <h:outputText value="#{authBean.currentUser.prenom} #{authBean.currentUser.nom}"/>
                    </div>
                    <div class="user-email">
                        <h:outputText value="#{authBean.currentUser.email}"/>
                    </div>
                </div>
            </div>
            <h:form>
                <h:commandLink action="#{authBean.logout}" styleClass="btn-logout">
                    <i data-lucide="log-out" style="width:16px;height:16px;"></i>
                    Se déconnecter
                </h:commandLink>
            </h:form>
        </div>
    </div>

    <!-- Main -->
    <div class="main-content">
        <!-- Topbar -->
        <div class="topbar">
        <span class="topbar-title">
            <ui:insert name="pageTitle">Dashboard</ui:insert>
        </span>
            <div class="topbar-right">
                <div class="topbar-badge">
                    <span class="badge-dot"></span>
                    En direct
                </div>
            </div>
        </div>

        <!-- Contenu injecté par chaque page -->
        <div class="page-content">
            <ui:insert name="content"/>
        </div>
    </div>

    <ui:insert name="scripts"/>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if(typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>

</h:body>
</html>
