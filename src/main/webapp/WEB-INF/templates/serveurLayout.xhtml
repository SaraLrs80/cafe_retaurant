<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rimberio — <ui:insert name="pageTitle">Serveur</ui:insert></title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --orange:        #F28C28;
            --orange-dark:   #D9711A;
            --orange-light:  #FFAB76;
            --orange-bg:     #FFF3EC;
            --dark:          #1A1208;
            --cream:         #FDFAF5;
            --sidebar-bg:    #1A1208;
            --sidebar-hover: #2E1A0A;
            --sidebar-active:#3D2210;
            --border:        #E8E0D0;
            --muted:         #7A7060;
            --white:         #FFFFFF;
            --red:           #C62828;
            --red-bg:        #FFEBEE;
            --green:         #2E7D32;
            --green-bg:      #F1F8E9;
            --green-light:   #4CAF50;
            --blue:          #1A6B9A;
            --blue-bg:       #E8F4FB;
        }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--cream); color:var(--dark); display:flex; min-height:100vh; }
        .sidebar { width:240px; background:var(--sidebar-bg); color:white; display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:100; }
        .sidebar-logo {
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: flex; align-items: center; gap: 11px;
            text-decoration: none;
        }

        .logo-img {
            width: 38px; height: 38px; border-radius: 10px;
            object-fit: cover; box-shadow: 0 4px 12px rgba(242,140,40,0.3);
            flex-shrink: 0;
        }

        .logo-text-block { display: flex; flex-direction: column; line-height: 1.1; }

        .logo-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem; font-weight: 900; color: white; letter-spacing: 1px;
        }
        .logo-name span { color: var(--orange); }

        .logo-role {
            font-size: 0.62rem; color: var(--orange-light);
            font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase;
            margin-top: 2px;
        }
        .sidebar-nav { flex:1; padding:16px 12px; overflow-y:auto; }
        .nav-section { font-size:.62rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,.3); padding:0 8px; margin-bottom:6px; margin-top:16px; }
        .nav-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; font-size:.85rem; color:rgba(255,255,255,.6); text-decoration:none; margin-bottom:2px; cursor:pointer; transition:all .18s; font-weight:400; }
        .nav-item i { width: 17px; height: 17px; stroke-width: 2; opacity: .7; transition: opacity .18s; }
        .nav-item:hover { background:var(--sidebar-hover); color:rgba(255,255,255,.9); }
        .nav-item:hover i { opacity: 1; stroke: currentColor; }
        .nav-item.active { background:var(--sidebar-active); color:var(--orange-light); font-weight:500; }
        .nav-item.active i { color:var(--orange-light); opacity: 1; }
        .sidebar-footer { padding:16px 12px; border-top:1px solid rgba(255,255,255,.08); }
        .user-info { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.05); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
        .user-avatar { width:34px; height:34px; background:linear-gradient(135deg, var(--orange), var(--orange-dark)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700; color:white; flex-shrink:0; }
        .user-name  { font-size:.82rem; font-weight:500; color:rgba(255,255,255,.9); }
        .user-email { font-size:.68rem; color:rgba(255,255,255,.4); margin-top:1px; }
        .logout-btn { display:flex; align-items:center; gap:8px; width:100%; padding:9px 12px; background:transparent; border:1px solid rgba(255,255,255,.1); border-radius:8px; font-size:.82rem; color:rgba(255,255,255,.5); cursor:pointer; transition:all .2s; text-decoration:none; }
        .logout-btn:hover { background:rgba(192,57,43,.15); border-color:rgba(192,57,43,.3); color:#E57373; text-decoration:none; }
        .main { margin-left:240px; flex:1; min-height:100vh; }
        .topbar { background:white; border-bottom:1px solid var(--border); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; }
        .topbar-title { font-size:1rem; font-weight:600; color:var(--dark); }
        .live-badge { display:flex; align-items:center; gap:6px; font-size:.75rem; color:var(--green); font-weight:500; }
        .live-dot { width:7px; height:7px; background:var(--green); border-radius:50%; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .content { padding:24px 28px; }
        .card { background:white; border-radius:12px; border:1px solid var(--border); overflow:hidden; }
        .card-head { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
        .card-head-title { font-size:.9rem; font-weight:600; }
        .btn { padding:9px 18px; border-radius:10px; font-size:.85rem; font-weight:600; border:none; cursor:pointer; transition:all .2s; text-decoration:none; display:inline-flex; align-items:center; gap:6px; justify-content:center; }
        .btn-primary   { background:linear-gradient(135deg, var(--orange), var(--orange-dark)); color:white; box-shadow:0 4px 14px rgba(242,140,40,.28); }
        .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(242,140,40,.38); }
        .btn-secondary { background:var(--cream); color:var(--dark); border:1.5px solid var(--border); }
        .btn-secondary:hover { background:#f0ebe0; border-color:#c8bfa8; color:var(--dark); }
        .btn-success   { background:var(--green-bg); color:var(--green); }
        .btn-success:hover { background:#C8E6C9; }
        .btn-danger    { background:var(--red-bg); color:var(--red); border:1.5px solid #FFCDD2; }
        .btn-danger:hover { background:#FFCDD2; }
        .btn-info      { background:var(--blue); color:white; }
        .btn-sm { padding:5px 10px; font-size:.76rem; }
        .data-table { width:100%; border-collapse:collapse; }
        .data-table th { background:#F8F5F0; font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); padding:10px 16px; text-align:left; border-bottom:1px solid var(--border); }
        .data-table td { padding:12px 16px; border-bottom:1px solid #F5F0EA; font-size:.84rem; vertical-align:middle; }
        .data-table tr:last-child td { border-bottom:none; }
        .data-table tr:hover td { background:#FDFAF7; }
        .badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:.7rem; font-weight:600; }
        .badge-success { background:var(--green-bg); color:var(--green); }
        .badge-warning { background:#FFF8E1; color:#E65100; }
        .badge-danger  { background:var(--red-bg); color:var(--red); }
        .badge-info    { background:var(--blue-bg); color:var(--blue); }
        .badge-muted   { background:#F0EBE3; color:var(--muted); }
        .section-header { display:flex; align-items:center; justify-content:space-between; }
        .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:20px; }
        .stat-card { background:white; border-radius:12px; border:1px solid var(--border); padding:18px; display:flex; align-items:center; gap:14px; }
        .stat-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
        .stat-icon.orange { background:var(--orange-bg); }
        .stat-icon.green  { background:var(--green-bg); }
        .stat-icon.blue   { background:var(--blue-bg); }
        .stat-value { font-size:1.4rem; font-weight:700; }
        .stat-label { font-size:.74rem; color:var(--muted); margin-top:2px; }
    </style>
</h:head>

<h:body>
    <div class="sidebar">
        <h:link outcome="/pages/serveur/dashboard" styleClass="sidebar-logo">
            <h:graphicImage library="images" name="Logo.jpeg" styleClass="logo-img" alt="RIMBERIO" />
            <div class="logo-text-block">
                <span class="logo-name">RIM<span>BERIO</span></span>
                <span class="logo-role">Espace Serveur</span>
            </div>
        </h:link>

        <nav class="sidebar-nav">

            <!-- PRINCIPAL -->
            <div class="nav-section">PRINCIPAL</div>
            <h:link outcome="/pages/serveur/dashboard"
                    styleClass="nav-item #{request.servletPath.contains('dashboard') ? 'active' : ''}">
                <i data-lucide="layout-dashboard"></i>
                Tableau de bord
            </h:link>

            <!-- GESTION -->
            <div class="nav-section">GESTION</div>
            <h:link outcome="/pages/serveur/reservations"
                    styleClass="nav-item #{request.servletPath.contains('reservations') ? 'active' : ''}">
                <i data-lucide="calendar-check"></i>
                Réservations
            </h:link>

            <h:link outcome="/pages/serveur/commandes"
                    styleClass="nav-item #{request.servletPath.contains('commandes') ? 'active' : ''}">
                <i data-lucide="shopping-bag"></i>
                Commandes
            </h:link>

            <!-- CONSULTATION -->
            <div class="nav-section">CONSULTATION</div>
            <h:link outcome="/pages/serveur/menu"
                    styleClass="nav-item #{request.servletPath.contains('menu') ? 'active' : ''}">
                <i data-lucide="book-open"></i>
                Menu du restaurant
            </h:link>

        </nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">
                    <h:outputText value="#{authBean.currentUser.prenom.substring(0,1)}#{authBean.currentUser.nom.substring(0,1)}"/>
                </div>
                <div>
                    <div class="user-name">
                        <h:outputText value="#{authBean.currentUser.prenom} #{authBean.currentUser.nom}"/>
                    </div>
                    <div class="user-email">
                        <h:outputText value="#{authBean.currentUser.email}"/>
                    </div>
                </div>
            </div>
            <h:form>
                <h:commandLink action="#{authBean.logout}" styleClass="logout-btn">
                    <i data-lucide="log-out" style="width:16px;height:16px;"></i>
                    Se déconnecter
                </h:commandLink>
            </h:form>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <span class="topbar-title"><ui:insert name="pageTitle">Serveur</ui:insert></span>
            <div class="live-badge"><div class="live-dot"></div> En direct</div>
        </div>
        <div class="content">
            <ui:insert name="content"/>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if(typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</h:body>
</html>
